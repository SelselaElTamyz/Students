<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة التميز</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
}

.box {
    width: 90%;
    max-width: 420px;
    margin: 60px auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #555;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    color: white;
    font-size: 18px;
}

.blue {
    background: #1976d2;
}

.green {
    background: #2e7d32;
}

.gray {
    background: #777;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
    text-align: center;
}

.page {
    display: none;
}

.page.show {
    display: block;
}

.result {
    display: none;
    text-align: right;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

.error {
    color: red;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="box">

<!-- الصفحة الرئيسية -->

<div id="home" class="page show">

<h1>⭐ سلسلة التميز</h1>

<p>نظام متابعة الطلاب</p>

<button class="blue" onclick="openParent()">
👨‍👩‍👧 صفحة ولي الأمر
</button>

<button class="green" onclick="openTeacher()">
👨‍🏫 صفحة المعلم
</button>

</div>


<!-- صفحة ولي الأمر -->

<div id="parent" class="page">

<h1>👨‍👩‍👧 ولي الأمر</h1>

<p>الاستعلام عن الطالب</p>

<input
type="text"
id="code"
placeholder="أدخل كود الطالب">

<button class="blue" onclick="search()">
🔎 استعلام
</button>

<div id="error" class="error"></div>

<div id="result" class="result">

<p>
<strong>اسم الطالب:</strong>
<span id="name"></span>
</p>

<p>
<strong>الصف:</strong>
<span id="grade"></span>
</p>

<p>
<strong>النتيجة:</strong>
<span id="status"></span>
</p>

</div>

<button class="gray" onclick="home()">
↩️ رجوع
</button>

</div>


<!-- صفحة المعلم -->

<div id="teacher" class="page">

<h1>👨‍🏫 صفحة المعلم</h1>

<p>دخول المعلم</p>

<input
type="password"
id="password"
placeholder="كلمة مرور المعلم">

<button class="green" onclick="teacherLogin()">
🔐 دخول
</button>

<p id="teacherMessage"></p>

<button class="gray" onclick="home()">
↩️ رجوع
</button>

</div>

</div>


<script>

var students = {

"1001": {
name: "أحمد محمد",
grade: "الصف الخامس الابتدائي",
status: "ناجح"
},

"1002": {
name: "محمد علي",
grade: "الصف السادس الابتدائي",
status: "ناجح"
},

"1003": {
name: "مريم أحمد",
grade: "الصف الرابع الابتدائي",
status: "ناجح"
}

};


function hideAll() {

document.getElementById("home").classList.remove("show");

document.getElementById("parent").classList.remove("show");

document.getElementById("teacher").classList.remove("show");

}


function home() {

hideAll();

document.getElementById("home").classList.add("show");

}


function openParent() {

hideAll();

document.getElementById("parent").classList.add("show");

}


function openTeacher() {

hideAll();

document.getElementById("teacher").classList.add("show");

}


function search() {

var code = document.getElementById("code").value.trim();

var error = document.getElementById("error");

var result = document.getElementById("result");

if (code == "") {

error.innerHTML = "من فضلك أدخل كود الطالب.";

result.style.display = "none";

return;

}

if (students[code]) {

error.innerHTML = "";

document.getElementById("name").innerHTML =
students[code].name;

document.getElementById("grade").innerHTML =
students[code].grade;

document.getElementById("status").innerHTML =
students[code].status;

result.style.display = "block";

}

else {

error.innerHTML = "كود الطالب غير موجود.";

result.style.display = "none";

}

}


function teacherLogin() {

var password =
document.getElementById("password").value;

var message =
document.getElementById("teacherMessage");

if (password == "") {

message.innerHTML = "من فضلك أدخل كلمة المرور.";

return;

}

message.innerHTML = "تم تسجيل الدخول.";

}

</script>

</body>
</html>
