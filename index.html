<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الطلاب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      padding: 50px 20px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .parent {
      background: #2196f3;
      color: white;
    }

    .teacher {
      background: #4caf50;
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>نظام الطلاب</h1>

    <button class="parent" onclick="parentPage()">
      صفحة ولي الأمر
    </button>

    <button class="teacher" onclick="teacherPage()">
      صفحة المعلم
    </button>
  </div>

  <script>
    function parentPage() {
      alert("صفحة ولي الأمر");
    }

    function teacherPage() {
      alert("صفحة المعلم");
    }
  </script>

</body>
</html>
