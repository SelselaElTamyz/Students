<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلسلة التميز</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}
.container{
  max-width:750px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
}
h1,h2{text-align:center}
input,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:8px;
  font-size:16px;
}
input{border:1px solid #ccc}
button{
  border:0;
  cursor:pointer;
  background:#333;
  color:white;
}
.student{
  background:#f8f8f8;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}
.error{color:red;text-align:center}
.success{color:green;text-align:center}
.evaluations{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
hr{margin:25px 0}
</style>
</head>

<body>

<div class="container">

<h1>سلسلة التميز</h1>

<h2>استعلام ولي الأمر</h2>

<input id="searchCode" placeholder="اكتب كود الطالب">
<button onclick="searchStudent()">بحث</button>

<div id="searchResult"></div>

<hr>

<h2>إدارة الطلاب</h2>

<input id="teacherCode" placeholder="كود الطالب">
<input id="teacherName" placeholder="اسم الطالب">
<input id="teacherGrade" placeholder="الصف الدراسي">

<div class="evaluations">
<input id="e1" placeholder="التقييم 1">
<input id="e2" placeholder="التقييم 2">
<input id="e3" placeholder="التقييم 3">
<input id="e4" placeholder="التقييم 4">
<input id="e5" placeholder="التقييم 5">
<input id="e6" placeholder="التقييم 6">
<input id="e7" placeholder="التقييم 7">
<input id="e8" placeholder="التقييم 8">
<input id="e9" placeholder="التقييم 9">
<input id="e10" placeholder="التقييم 10">
<input id="e11" placeholder="التقييم 11">
<input id="e12" placeholder="التقييم 12">
<input id="e13" placeholder="التقييم 13">
<input id="e14" placeholder="التقييم 14">
<input id="e15" placeholder="التقييم 15">
</div>

<button onclick="addStudent()">إضافة طالب</button>
<button onclick="updateStudent()">تعديل طالب</button>

<div id="message"></div>

</div>

<script>

const SUPABASE_URL =
"https://jdpppofgbthxagbpldrb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rPIV8Vq1WHjy3WOE8tlyMQ_AJlT1Ff5";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function searchStudent(){

const code =
document.getElementById("searchCode").value.trim();

const result =
document.getElementById("searchResult");

if(!code){
result.innerHTML='<div class="error">اكتب كود الطالب</div>';
return;
}

const {data,error}=await db
.from("students")
.select("*")
.eq("student_code",code)
.maybeSingle();

if(error){
result.innerHTML=
'<div class="error">حدث خطأ أثناء البحث</div>';
return;
}

if(!data){
result.innerHTML=
'<div class="error">لم يتم العثور على الطالب</div>';
return;
}

let evaluations="";

for(let i=1;i<=15;i++){

evaluations+=`
<p>
<strong>التقييم ${i}:</strong>
${escapeHtml(data["evaluation_"+i]||"")}
</p>
`;
}

result.innerHTML=`
<div class="student">

<h3>${escapeHtml(data.student_name)}</h3>

<p>
<strong>كود الطالب:</strong>
${escapeHtml(data.student_code)}
</p>

<p>
<strong>الصف:</strong>
${escapeHtml(data.grade||"")}
</p>

<hr>

${evaluations}

</div>
`;
}

async function addStudent(){

const row=getFormData();

if(!row.student_code||!row.student_name){

showMessage(
"اكتب كود الطالب واسم الطالب",
"error"
);

return;
}

const {error}=await db
.from("students")
.insert([row]);

if(error){

showMessage(
"حدث خطأ: "+error.message,
"error"
);

return;
}

showMessage(
"تمت إضافة الطالب بنجاح",
"success"
);

clearForm();
}

async function updateStudent(){

const code=
document.getElementById("teacherCode")
.value.trim();

if(!code){

showMessage(
"اكتب كود الطالب",
"error"
);

return;
}

const {data:student,error:findError}=
await db
.from("students")
.select("id")
.eq("student_code",code)
.maybeSingle();

if(findError||!student){

showMessage(
"الطالب غير موجود",
"error"
);

return;
}

const row=getFormData();

const {error}=await db
.from("students")
.update(row)
.eq("id",student.id);

if(error){

showMessage(
"حدث خطأ: "+error.message,
"error"
);

return;
}

showMessage(
"تم تعديل بيانات الطالب بنجاح",
"success"
);
}

function getFormData(){

const row={

student_code:
document.getElementById("teacherCode")
.value.trim(),

student_name:
document.getElementById("teacherName")
.value.trim(),

grade:
document.getElementById("teacherGrade")
.value.trim()

};

for(let i=1;i<=15;i++){

row["evaluation_"+i]=
document.getElementById("e"+i)
.value.trim();

}

return row;
}

function clearForm(){

document.querySelectorAll("input")
.forEach(input=>{
input.value="";
});

}

function showMessage(message,type){

const element=
document.getElementById("message");

element.className=type;
element.textContent=message;
}

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
