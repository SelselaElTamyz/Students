<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلسلة التميز | أ/ محمد القهوجى</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef5ff,#f8fafc);
color:#222;
}

.container{
width:94%;
max-width:650px;
margin:25px auto;
background:#fff;
padding:22px;
border-radius:22px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
min-height:90vh;
}

.page{display:none}
.page.active{display:block}

/* الهوية */
.brand{
text-align:center;
padding:8px 0 20px;
border-bottom:1px solid #eee;
margin-bottom:22px;
}

.brand-title-main{
font-size:38px;
font-weight:900;
color:#1565C0;
margin-bottom:8px;
}

.teacher-name{
font-size:27px;
font-weight:900;
color:#D4AF37;
margin-bottom:1px;
}

.teacher-title{
font-size:18px;
font-weight:bold;
color:#6A1B6D;
margin-top:0;
}

/* العناوين */
h1,h2,h3{text-align:center}

h1{color:#1565C0}

p{color:#555}

/* الحقول */
input,select{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
background:#fff;
outline:none;
}

input:focus,select:focus{
border-color:#1565C0;
box-shadow:0 0 0 2px rgba(21,101,192,.1);
}

/* الأزرار */
button{
width:100%;
padding:14px;
margin:7px 0;
border:none;
border-radius:10px;
color:white;
font-size:17px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

button:hover{
opacity:.92;
transform:translateY(-1px);
}

.blue{background:#1976D2}
.green{background:#2E7D32}
.red{background:#C62828}
.gray{background:#777}
.orange{background:#EF6C00}

/* الرسائل */
.message{
text-align:center;
font-weight:bold;
margin:12px;
}

.success{color:#2E7D32}
.error{color:#C62828}

/* البطاقات */
.card{
background:#F8FAFC;
border:1px solid #E2E8F0;
border-radius:14px;
padding:16px;
margin:12px 0;
}

/* التقييمات */
.evaluation{
display:flex;
gap:8px;
align-items:center;
margin:8px 0;
}

.evaluation strong{
width:110px;
}

.evaluation select{
flex:1;
margin:0;
}

/* الخط */
hr{
border:none;
border-top:1px solid #E5E7EB;
margin:22px 0;
}

/* الصفحة الرئيسية */
.home-icon{
font-size:45px;
text-align:center;
margin:5px 0 10px;
}

.subtitle{
text-align:center;
font-size:16px;
margin-bottom:22px;
}

/* التذييل */
.footer{
text-align:center;
margin-top:30px;
padding-top:16px;
border-top:1px solid #eee;
color:#777;
font-size:13px;
line-height:1.8;
}

.footer strong{
color:#555;
}
</style>
</head>

<body>

<div class="container">

<!-- الصفحة الرئيسية -->
<div id="home" class="page active">

<div class="brand">
<div class="brand-title-main">⭐ سلسلة التميز</div>

<div class="teacher-name">
أ/ محمد القهوجى
</div>

<div class="teacher-title">
معلم الرياضيات والإحصاء
</div>
</div>

<div class="home-icon">📚</div>

<p class="subtitle">
نظام متابعة الطلاب
</p>

<button class="blue" onclick="showPage('parent')">
👨‍👩‍👧 صفحة ولي الأمر
</button>

<button class="green" onclick="showPage('teacherLogin')">
👨‍🏫 صفحة المعلم
</button>

<div class="footer">
<strong>تصميم وبرمجة أ/ محمد القهوجى</strong>
<br>
© 2026 جميع الحقوق محفوظة
</div>

</div>


<!-- دخول المعلم -->
<div id="teacherLogin" class="page">

<div class="brand">
<div class="brand-title-main">⭐ سلسلة التميز</div>

<div class="teacher-name">
أ/ محمد القهوجى
</div>

<div class="teacher-title">
معلم الرياضيات والإحصاء
</div>
</div>

<h2>👨‍🏫 دخول المعلم</h2>

<input
id="teacherEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="teacherPassword"
type="password"
placeholder="كلمة المرور">

<button class="green" onclick="loginTeacher()">
🔐 دخول
</button>

<div id="loginMessage" class="message"></div>

<button class="gray" onclick="showPage('home')">
↩️ رجوع
</button>

<div class="footer">
<strong>تصميم وبرمجة أ/
