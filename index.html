.teacher-name{

text-align:center;
}

.teacher-title{

}

select:focus{
border-color:#1565C0;

}

button{

}

button:hover{

}

.blue{

}

.green{
background:#2E7D32;
}

.red{
background:#C62828;
}

.gray{

}

.orange{
background:#C2410C;
}


/* ================= الرسائل ================= */

.message{
text-align:center;
font-weight:bold;
margin:12px;
}

.success{
color:#2E7D32;
}

.error{
color:#C62828;
}


/* ================= البطاقات ================= */

.card{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:15px;
padding:16px;
margin:12px 0;
}


/* ================= التقييمات ================= */

.evaluation{

gap:8px;
align-items:center;
margin:8px 0;
}

.evaluation strong{
width:110px;
color:#334155;
}

.evaluation select{
flex:1;
margin:0;
}
